<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="1;url=https://discuss-surveys-rip-carmen.trycloudflare.com">
<title>Ngobrol — AMIK Serang</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#0b0f1a;--bg2:#0e1424;--card:#141b2e;--line:#243049;--text:#e6edf7;--muted:#93a1bb;--accent:#3b82f6;--accent2:#22d3ee}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 50% -10%,#16233f 0%,var(--bg) 55%);
       color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px}
  .card{width:100%;max-width:400px;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
        border-radius:20px;padding:32px 26px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .logo{width:64px;height:64px;border-radius:16px;margin:0 auto 16px;display:grid;place-items:center;font-size:30px;
        background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 30px rgba(59,130,246,.45)}
  h1{margin:0 0 4px;font-size:24px;letter-spacing:.2px}
  .sub{margin:0 0 22px;color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:2px}
  p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
  .spinner{width:34px;height:34px;margin:20px auto;border-radius:50%;border:3px solid var(--line);
           border-top-color:var(--accent2);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  a.btn{display:inline-block;margin-top:20px;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:700;
        color:#05122b;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .note{margin-top:18px;font-size:12px;color:#6b7a99}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">💬</div>
    <h1>Ngobrol</h1>
    <div class="sub">AMIK Serang</div>
    <div class="spinner" aria-hidden="true"></div>
    <p>Membuka aplikasi Ngobrol…</p>
    <a class="btn" href="https://discuss-surveys-rip-carmen.trycloudflare.com">Buka sekarang</a>
    <p class="note">Jika halaman tidak terbuka otomatis, tekan tombol di atas.</p>
  </div>
  <script>setTimeout(function(){location.replace("https://discuss-surveys-rip-carmen.trycloudflare.com");},900);</script>
</body>
</html>
